<title>3분 비즈니스 영어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow phone column. Home = today's three rounds as a numbered sequence; a round = one card per screen with a single action at the bottom. */
:root{
  color-scheme:light dark;
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#141C26; --muted:#5A6878; --line:#D5DCE5;
  --accent:#1B55C8; --on-accent:#FFFFFF; --soft:#E3EBFA;
  --mail:#1B55C8; --phone:#0B7A6E; --meet:#8A3D8F;
  --near:#A85F00; --good:#12754A; --good-bg:#DDF2E6; --bad:#B3321F; --bad-bg:#FBE4DF;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141A; --surface:#19212B; --ink:#E9EEF4; --muted:#96A4B4; --line:#2C3743;
    --accent:#7BA6FF; --on-accent:#0B1322; --soft:#1E2B45;
    --mail:#7BA6FF; --phone:#4FC9B8; --meet:#D08BD5;
    --near:#F0A94A; --good:#62D39A; --good-bg:#143326; --bad:#FF8E7A; --bad-bg:#3A1B16;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#19212B; --ink:#E9EEF4; --muted:#96A4B4; --line:#2C3743;
  --accent:#7BA6FF; --on-accent:#0B1322; --soft:#1E2B45;
  --mail:#7BA6FF; --phone:#4FC9B8; --meet:#D08BD5;
  --near:#F0A94A; --good:#62D39A; --good-bg:#143326; --bad:#FF8E7A; --bad-bg:#3A1B16;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
#app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:26px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:13px;margin:0;font-weight:600;color:var(--muted);letter-spacing:.04em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.03em;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.streak{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap}
.block{display:flex;flex-direction:column;gap:10px}

/* today's rounds */
.rounds{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.round{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;background:none;border:0;text-align:left;border-top:1px solid var(--line)}
.round:first-child{border-top:0}
.round .n{font-family:var(--mono);font-size:15px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--muted);flex:none}
.round .t{flex:1;min-width:0}
.round .t b{display:block;font-weight:600}
.round .t span{font-size:13px;color:var(--muted)}
.round .s{font-size:13px;color:var(--muted);white-space:nowrap}
.round.done .n{background:var(--good-bg);border-color:transparent;color:var(--good)}
.round.done .s{color:var(--good)}
.round.next .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.round.next .s{color:var(--accent);font-weight:600}
.cta{width:100%;padding:16px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px}
.cta[disabled]{background:var(--line);color:var(--muted);border-color:transparent;opacity:1;cursor:default}
.ghost{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:transparent;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.chip[aria-pressed="true"]::before{content:"✓ "}
.chip[aria-pressed="false"]{color:var(--muted)}
.chip.tm{border-color:var(--accent);color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:44px 1fr 48px;align-items:center;gap:10px;font-size:14px}
.bar i{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i u{display:block;height:100%;border-radius:4px}
.bar span:last-child{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}

/* session */
.sbar{display:flex;align-items:center;gap:12px}
.x{width:40px;height:40px;border-radius:50%;border:0;background:transparent;font-size:22px;color:var(--muted);flex:none}
.prog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog u{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
@media (prefers-reduced-motion: reduce){.prog u{transition:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.cat{font-family:var(--mono);font-size:12px;letter-spacing:.06em}
.cat.m{color:var(--mail)}.cat.p{color:var(--phone)}.cat.t{color:var(--meet)}
.ko{font-size:17px;color:var(--muted)}
.ko.big{font-size:21px;color:var(--ink);font-weight:600;line-height:1.4}
.en{font-size:25px;line-height:1.3;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.tip{font-size:14px;background:var(--soft);border-radius:10px;padding:10px 12px}
.listen{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:14px}
.listen svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-size:16px;line-height:1.4}
.opt.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.slot{min-height:58px;border-bottom:2px solid var(--line);padding-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tok{padding:9px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:17px;font-weight:500}
.tok.used{visibility:hidden}
.fb{border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb b{display:block;font-size:17px;margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .cta.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.sit{font-size:14px;color:var(--muted);margin-top:-4px}
.hint{font-family:var(--mono);font-size:16px;letter-spacing:.04em;background:var(--soft);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
.lbl{font-size:12px;color:var(--muted);margin-bottom:-8px}
.mine{font-size:17px;color:var(--muted);overflow-wrap:anywhere}
.w-ok{color:var(--good)}
.w-no{color:var(--bad);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.say{display:flex;gap:10px;align-items:stretch}
.say textarea{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:none}
.say textarea:focus{outline:none;border-color:var(--accent)}
.mic{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:72px;border-radius:12px;border:1.5px solid var(--accent);background:var(--soft);color:var(--accent);font-size:13px;font-weight:600}
.mic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
.howto{font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.howto summary{cursor:pointer;font-weight:600;color:var(--accent)}
.howto ol{margin:8px 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.howto p{font-size:13px}
.w-near{color:var(--near);text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:4px}
.ghost.small{padding:10px;font-size:14px}
.notice{background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.notice a{color:var(--accent);font-weight:600;overflow-wrap:anywhere}
.code{width:100%;font-family:var(--mono);font-size:12px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:none;margin-top:8px}
.howto .two{margin-top:8px}
.howto .cta{margin-top:8px}
.bkmsg{margin-top:8px;color:var(--ink)}
.auto{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:12px 14px}
.auto .at{flex:1;min-width:0;display:flex;flex-direction:column}
.auto .at span{font-size:13px;color:var(--muted)}
.auto .ghost.small{width:auto;flex:none;padding:8px 12px;background:var(--surface)}
.cd{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.auto.on .dot{flex:none;width:14px;height:14px;border-radius:50%;background:var(--bad);margin:0 15px;animation:pulse 1s ease-in-out infinite}
.auto .limit{position:absolute;left:0;bottom:0;height:4px;background:var(--bad);animation:shrink 5s linear forwards}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
@keyframes shrink{from{width:100%}to{width:0}}
@media (prefers-reduced-motion: reduce){.auto.on .dot,.auto .limit{animation:none}}
.w-minor{color:var(--muted);text-decoration:underline dotted;text-underline-offset:4px}
.install{background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ihead{display:flex;gap:12px;align-items:center}
.ihead img{border-radius:10px;flex:none}
.ihead div{display:flex;flex-direction:column;min-width:0}
.ihead span{font-size:13px;color:var(--muted)}
.install ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.sel{user-select:all;-webkit-user-select:all;color:var(--ink);overflow-wrap:anywhere}
.hints{display:flex;flex-direction:column;gap:10px}
.hint1{font-size:16px;background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.hint2{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.hints .hint{display:flex;flex-direction:column;gap:2px}
.lbl2{font-family:var(--sans);font-size:12px;letter-spacing:0;color:var(--muted)}
.chipw{display:flex;flex-wrap:wrap;gap:6px}
.wchip{padding:4px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:16px;font-weight:500}
.prac{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ph{display:flex;flex-direction:column}
.ph span{font-size:13px;color:var(--muted)}
.prac .ghost.small,.prac .mic.wide{display:flex;align-items:center;justify-content:center;gap:8px}
.prac .ghost.small svg,.mic.wide svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.mic.wide{width:100%;flex-direction:row;padding:12px}
.en.small{font-size:19px}
.listen.big{padding:14px 20px;font-size:16px;align-self:stretch;justify-content:center}
.listen.big svg{width:22px;height:22px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.wk i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.wk.on i{background:var(--good);border-color:var(--good)}
.wk.today{border-color:var(--accent)}
.wk .mono{font-size:11px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.fld input{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.fld input:focus{outline:none;border-color:var(--accent)}
.ghost.small.danger{border-color:var(--bad);color:var(--bad);width:auto}
.li .ghost.small{width:auto;flex:none}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.gtop{display:flex;justify-content:space-between;gap:8px}
.gtop span{font-size:13px;color:var(--muted)}
.gbar{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.gbar u{display:block;height:100%;background:var(--good);border-radius:4px}
.xgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xbtn{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.xbtn b{font-size:16px}
.xbtn span{font-size:13px;color:var(--muted);line-height:1.4}
.cmp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sbar .tt{display:flex;flex-direction:column;min-width:0}
.tries{display:flex;flex-direction:column;gap:8px}
.try{display:grid;grid-template-columns:36px 1fr 48px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.try .en.small{font-size:16px;margin:0}
.code.big{font-family:var(--sans);font-size:17px;padding:12px 14px;background:var(--surface)}
.btnli{width:100%;text-align:left;cursor:pointer}
.badge{flex:none;font-family:var(--mono);font-size:12px;padding:4px 8px;border-radius:999px;background:var(--good-bg);color:var(--good)}
.script{display:flex;flex-direction:column;gap:8px}
.sl{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sl.now{border-color:var(--accent);background:var(--soft)}
.sl .who{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--accent);color:var(--on-accent)}
.sl.b .who{background:var(--phone)}
.sl p{margin:0}
.sko{font-size:13px;color:var(--muted)}
.qq{font-weight:600;margin-top:4px}
.easy{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--good-bg);border-radius:10px;padding:8px 12px;font-size:16px}
.easy .lbl2{color:var(--good);font-weight:700}
.easy .listen.small{padding:6px;border-radius:50%;margin-left:auto}
.ezw{color:var(--good);font-weight:600}
.pos{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:700;line-height:1;padding:3px 5px;border-radius:5px;vertical-align:2px;letter-spacing:0}
.pos-n{background:var(--soft);color:var(--accent)}.pos-v{background:var(--good-bg);color:var(--good)}.pos-a{background:var(--bad-bg);color:var(--meet)}.pos-d{background:var(--bad-bg);color:var(--near)}.pos-x{background:var(--line);color:var(--muted)}
.qzq .pos{font-size:14px;vertical-align:6px}
.base{font-size:12px;color:var(--muted);font-weight:400}
.ipas{font-size:14px;color:var(--muted);line-height:1.7}
.ipa{font-family:"Noto Sans","Segoe UI","Arial Unicode MS",var(--sans);color:var(--ink)}
.nfsel{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.qzhead{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.qzcombo{color:var(--near)}
.qzmute{background:none;border:0;font-size:16px;padding:0 0 0 6px}
.qzcard .listen.big{align-self:stretch}
.qzbar{height:10px}
.qzcard{text-align:center;padding:26px 18px}
.qzq{font-size:28px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.lvsteps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.lvsteps span{font-size:12px;text-align:center;padding:7px 2px;border-radius:10px;border:1.5px solid var(--line);color:var(--muted)}
.lvsteps span.on{border-color:var(--accent);color:var(--ink);background:var(--soft);font-weight:700}
.lvsteps span.done{border-color:var(--good);color:var(--good)}
#lvwords span{color:var(--muted)}#lvwords span.past{color:var(--ink)}#lvwords span.cur{color:var(--accent);text-decoration:underline;text-underline-offset:5px}
#lvsvg{width:100%;height:auto;display:block;background:var(--bg);border-radius:10px}
.cmp .cta{font-size:15px;padding:13px}
.pg{display:flex;flex-direction:column;gap:6px}
.pg svg{width:100%;height:auto;display:block;background:var(--bg);border-radius:10px}
.pgleg{display:flex;gap:14px;font-size:13px;flex-wrap:wrap}
.pgleg i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
.pgstat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.pgstat div{background:var(--soft);border-radius:10px;padding:8px;text-align:center;display:flex;flex-direction:column}
.pgstat b{font-size:18px;font-variant-numeric:tabular-nums}
.pgstat span{font-size:12px;color:var(--muted)}
.ver{text-align:center;font-family:var(--mono);font-size:12px}
.fld textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;resize:vertical}
.fld textarea:focus{outline:none;border-color:var(--accent)}
.two input{width:100%}
.nlink{text-decoration:none;color:inherit}
.li .go,.nlink .go{flex:none;font-size:13px;color:var(--accent);font-weight:600}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;display:flex;flex-direction:column;gap:4px}
.bub p{margin:0}
.bub.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.lnk{align-self:flex-start;background:none;border:0;padding:0;font-size:13px;color:var(--accent);text-decoration:underline}
.fixbox{align-self:flex-end;max-width:88%;background:var(--good-bg);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.fixbox p{margin:0}
.mailout{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--sans);font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0}
.fb.mid{background:var(--soft);color:var(--ink)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.three .cta{font-size:14px;padding:14px 6px}
.three .cta.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.big-num{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}

/* list */
.li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.li div{flex:1;min-width:0}
.li b{display:block;font-weight:600;overflow-wrap:anywhere}
.li span{font-size:13px;color:var(--muted)}
.li .listen{padding:8px;border-radius:50%;align-self:center}
.li.new b{color:var(--muted);font-weight:500}
</style>

<div id="app"></div>
<script src="audio.js"></script>

  return out.slice(0,5);
}
function pickNew(){
  var un=ORDER.filter(function(x){return !S.items[x.id];});
  var f=S.focus==="all"?un:un.filter(function(x){return x.cat===S.focus;});
  if(f.length<perDay())f=f.concat(un.filter(function(x){return f.indexOf(x)<0;}));
  return f.slice(0,perDay()).map(function(x){return x.id;});
}
function learnedCount(cat){var n=0;for(var id in S.items){if(BYID[id]&&(!cat||BYID[id].cat===cat))n++;}return n;}
function studied(k){var x=S.days[k];return !!(x&&((x.done&&(x.done[0]||x.done[1]||x.done[2]))||x.extra));}
function weekStart(k){var p=k.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]),w=(d.getDay()+6)%7;return addDays(k,-w);}
/* 연속 일수: 한 주에 하루는 빠져도 이어진다(보호권) */
function streakInfo(){
  var n=0,d=today(),used={};
  if(!studied(d))d=addDays(d,-1);
  for(var g=0;g<4000;g++){
    if(studied(d)){n++;d=addDays(d,-1);continue;}
    var wk=weekStart(d),prev=addDays(d,-1);
    if(n>0&&!used[wk]&&studied(prev)){used[wk]=d;d=prev;continue;}
    break;
  }
  return {n:n,usedThisWeek:!!used[weekStart(today())]};
}
function streak(){return streakInfo().n;}
function weekDone(){var s=weekStart(today()),c=0;for(var i=0;i<7;i++){var k=addDays(s,i);if(k>today())break;if(studied(k))c++;}return c;}
function nextRound(){var d=day();for(var i=0;i<3;i++)if(!d.done[i])return i;return -1;}
function grade(id,ok){
  var t=today(),it=S.items[id];
  if(!it){it=S.items[id]={box:1,due:addDays(t,1),learned:t};}
  if(it.learned===t)return;                 /* 오늘 배운 것은 내일부터 간격 복습 */
  if(ok==="mid"){it.due=addDays(t,1);return;}  /* 힌트 보고 맞힘: 단계 유지, 내일 다시 */
  if(ok===true){it.box=Math.min((it.box||1)+1,5);it.due=addDays(t,INT[it.box]);}
  else{it.box=1;it.due=t;}
}

var view="home", ses=null;
function startRound(n){
  var d=day();
  if(n>0&&!d.done[0])n=0;
  var steps=[],ids;
  if(n===0){
    if(!d["new"].length){d["new"]=pickNew();}
    ids=d["new"]=d["new"].filter(function(id){return BYID[id];});
    if(ids.length){
      var t=today();
      ids.forEach(function(id){if(!S.items[id])S.items[id]={box:1,due:addDays(t,1),learned:t};steps.push({k:"learn",id:id});});
      shuffle(ids).forEach(function(id){steps.push({k:"order",id:id});});
    }else{
      ids=dueOld();
      if(!ids.length){ids=Object.keys(S.items).filter(function(id){return BYID[id];}).sort(function(a,b){return (S.items[a].box||1)-(S.items[b].box||1);}).slice(0,5);}
      shuffle(ids).forEach(function(id){steps.push({k:"order",id:id});});
    }
  }else{
    ids=d["new"].filter(function(id){return BYID[id];});
    ids=ids.concat(dueOld().filter(function(id){return ids.indexOf(id)<0;}));
    shuffle(ids).forEach(function(id,k){steps.push({k:n===1?(k%2&&hasAudio(id)?"hear":"choice"):"recall",id:id});});
  }
  ses={n:n,steps:steps,i:0,total:0,right:0,st:null};
  view="session";save();enter();render();
}
function enter(){
  var s=ses.steps[ses.i];if(!s){return;}
  var it=BYID[s.id];
  if(s.k==="order"){
    var toks=orderTokens(it.en),sh=shuffle(toks.map(function(w,i){return {w:w,i:i};}));
    if(toks.length>1&&sh.map(function(x){return x.w;}).join(" ")===toks.join(" "))sh.push(sh.shift());
    ses.st={bank:sh,picked:[],res:null,toks:toks};
  }else if(s.k==="choice"||s.k==="hear"){
    var mine=wordSet(it.en);
    var same=ITEMS.filter(function(x){return x.cat===it.cat&&x.id!==it.id;}).map(function(x){
      var sc=0,ws=wordSet(x.en);for(var w in ws)if(mine[w])sc+=STOP[w]?0.3:1;
      return {x:x,sc:sc+Math.random()*0.9};
    }).sort(function(a,b){return b.sc-a.sc;}).slice(0,6).map(function(o){return o.x;});
    ses.st={opts:shuffle(shuffle(same).slice(0,3).concat([it])).map(function(x){return x.id;}),sel:null};
    if(s.k==="hear")speak(s.id);
  }else if(s.k==="recall"){ses.st={hint:0,text:"",partial:"",res:null,shown:false,listening:false,phase:"manual",tries:0,chips:shuffle(orderTokens(it.en))};if(autoOn())setTimeout(beginThink,0);}
  else{ses.st={};speak(s.id);}
}
function answered(ok){
  var s=ses.steps[ses.i];
  if(!s.again){ses.total++;if(ok===true)ses.right++;var da=day();da.ans=da.ans||[0,0];da.ans[0]++;if(ok===true)da.ans[1]++;}
  grade(s.id,ok);
  if(ok!==true){var dw=day();if(!dw.wrong)dw.wrong=[];if(dw.wrong.indexOf(s.id)<0)dw.wrong.push(s.id);}
  if(ok===false&&!s.again)ses.steps.push({k:s.k,id:s.id,again:true});
}

/* ---- 3판: 상황 보고 말하기 ---- */
var CONTR={"i'm":"i am","can't":"can not","cannot":"can not","won't":"will not","don't":"do not","it's":"it is","that's":"that is","let's":"let us","i'll":"i will","we'll":"we will","you're":"you are","we're":"we are","i've":"i have","isn't":"is not","we'd":"we would","i'd":"i would"};
function parts(w){
  w=w.toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[^a-z0-9']/g,"");
  if(!w)return [];
  var e=CONTR[w];return (e?e:w.replace(/'/g,"")).split(" ").filter(Boolean);
}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  for(i=0;i<=m;i++){d.push([i]);}for(j=1;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
/* 발음이 비슷해 잘못 받아 적힌 단어(find/fine, quote/coat 등)를 "거의 맞음"으로 본다 */
function sim(a,b){
  if(a===b)return 2;
  if(a.length<3||b.length<3)return 0;
  var k=Math.max(a.length,b.length)<=5?1:2;
  return lev(a,b)<=k?1:0;
}
function diff(answer,said){
  var words=answer.split(" "),A=[],own=[];
  words.forEach(function(w,wi){parts(w).forEach(function(p){A.push(p);own.push(wi);});});
  var B=[];said.split(/\s+/).forEach(function(w){B=B.concat(parts(w));});
  var n=A.length,m=B.length,L=[],i,j;
  for(i=0;i<=n;i++){L.push(new Array(m+1).fill(0));}
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--){var sv=sim(A[i],B[j]);L[i][j]=Math.max(L[i+1][j],L[i][j+1],sv?L[i+1][j+1]+sv:0);}
  var hit=new Array(n).fill(0);i=0;j=0;
  while(i<n&&j<m){var s2=sim(A[i],B[j]);if(s2&&L[i][j]===L[i+1][j+1]+s2){hit[i]=s2;i++;j++;}else if(L[i+1][j]>=L[i][j+1])i++;else j++;}
  var wst=words.map(function(){return 2;}),wmin=words.map(function(){return true;});
  own.forEach(function(wi,k){wst[wi]=Math.min(wst[wi],hit[k]);if(!hit[k]&&!MINOR[A[k]])wmin[wi]=false;});
  var got=hit.filter(Boolean).length,exact=hit.filter(function(x){return x===2;}).length;
  var wsum=0,wgot=0,content=true;
  A.forEach(function(p,k){var w=MINOR[p]?0.4:1;wsum+=w;if(hit[k])wgot+=w;else if(!MINOR[p])content=false;});
  return {words:words,wst:wst,wmin:wmin,ratio:wsum?wgot/wsum:0,exact:n?exact/n:0,near:got-exact,extra:m-got,content:content,minorMiss:n-got>0&&content};
}
/* 인식기가 자주 빼먹는 짧은 단어: 틀려도 점수를 덜 깎는다 */
var MINOR={a:1,an:1,the:1,to:1,of:1,for:1,in:1,on:1,at:1,by:1,is:1,are:1,am:1,it:1,that:1,this:1,with:1,and:1,be:1,so:1,some:1,any:1};

var OVR=null;
function sink(){

  var st=ses.st,s=ses.steps[ses.i];if(!st||!s||s.k!=="recall")return null;

}
function dictOK(){return !!DICT&&!dictOff;}
function curRecall(){return view==="session"&&ses&&ses.steps[ses.i]&&ses.steps[ses.i].k==="recall"&&!ses.st.res&&!ses.st.shown?ses.st:null;}
function syncBox(){
  var t=sink();
  if(t&&t===OVR){if(OVR.onUpdate)OVR.onUpdate();return;}
  if(t&&ses&&t===ses.st.prac){var pe=document.getElementById("pracText");if(pe)pe.textContent=(t.text+" "+(t.partial||"")).trim()||"듣고 있습니다…";return;}
  var st=curRecall(),ta=document.getElementById("ans");if(!st||!ta)return;
  ta.value=st.text+(st.partial?(st.text?" ":"")+st.partial:"");

function stopDict(){if(DICT&&DICT.active()){DICT.stop().catch(function(){});}}
function wireDict(d){
  d.onPartial(function(e){if(d!==DICT)return;var st=sink();if(!st)return;
    if(st===OVR){if(e.speech||e.text)st.heard=true;if(!e.speech)st.partial=e.text;if(OVR.onUpdate)OVR.onUpdate();return;}
    if(ses&&st===ses.st.prac){if(!e.speech){st.partial=e.text;syncBox();}return;}
    if(e.speech){if(!st.heard){st.heard=true;render();}return;}
    if(e.text&&!st.heard){st.heard=true;st.partial=e.text;render();return;}
    st.partial=e.text;syncBox();});
  d.onFinal(function(e){if(d!==DICT)return;var st=sink();if(st){st.text=st.text?st.text+e.text:e.text.replace(/^\s+/,"");st.partial="";syncBox();}});
  d.onState(function(e){
    if(d!==DICT)return;
    var st=sink(),on=e.state!=="idle";
    if(e.state==="idle"&&(e.reason==="not_granted"||e.reason==="unavailable"))dictOff=true;
    if(!st)return;
    if(st===OVR){
      if(on){st.listening=true;st.busy=e.state==="finishing";if(OVR.onUpdate)OVR.onUpdate(true);return;}
      st.listening=false;st.busy=false;st.partial="";var o=OVR;OVR=null;if(o.done)o.done(o);return;
    }
    if(ses&&st===ses.st.prac){
      if(on){var bz=e.state==="finishing";if(!st.listening||bz!==!!st.busy){st.listening=true;st.busy=bz;render();}return;}
      st.listening=false;st.busy=false;st.partial="";st.on=false;
      st.res=diff(BYID[ses.steps[ses.i].id].en,st.text.trim());render();return;
    }
    if(on){var busy=e.state==="finishing";if(!st.listening||busy!==!!st.busy){st.listening=true;st.busy=busy;render();}return;}
    st.listening=false;st.busy=false;st.partial="";
    if(st.phase==="listen"){
      clearAuto();
      if(st.text.trim()){doCheck();return;}
      if(dictOff||(e.reason&&e.reason!=="no_speech"&&e.reason!=="stopped")){st.phase="manual";render();return;}
      handleTimeout();return;
    }
    render();
  });
}
function pickDict(){

/* ---- 3판 자동 진행: 생각 시간 → 자동 듣기 → 자동 채점 ---- */
var AUTO={iv:null,lt:null};
function autoOn(){return S.auto!==false&&dictOK();}
function clearAuto(){clearInterval(AUTO.iv);clearTimeout(AUTO.lt);AUTO.iv=AUTO.lt=null;}
function beginThink(){
  var st=curRecall();if(!st)return;
  clearAuto();st.phase="think";st.count=S.think||3;st.heard=false;render();
  AUTO.iv=setInterval(function(){
    if(curRecall()!==st){clearAuto();return;}
    st.count--;
    if(st.count<=0){clearAuto();startListen();return;}
    var el=document.getElementById("cd");if(el)el.textContent=st.count;
    var b2=document.querySelector("#autobox .at span");if(b2)b2.textContent=st.count+"초 뒤 듣기 시작";
  },1000);
}
function startListen(){
  var st=curRecall();if(!st||!DICT)return;
  clearAuto();st.phase="listen";st.heard=false;st.note="";render();
  DICT.start({language:"en"}).catch(function(err){
    var c=err&&err.code;if(c==="not_granted"||c==="unavailable")dictOff=true;
    if(curRecall()===st){clearAuto();st.phase="manual";st.listening=false;st.note="";render();}
  });
  AUTO.lt=setTimeout(function(){if(curRecall()===st&&st.phase==="listen"&&!st.heard){stopDict();}},5500);

function handleTimeout(){
  var st=curRecall();if(!st)return;

  else{st.text="";doCheck(true);}

function doCheck(timeout){
  var st=ses&&ses.st,s=ses&&ses.steps[ses.i];if(!st||!s)return;

  st.grade=timeout?false:full&&!st.hint?true:(full||st.res.ratio>=0.6)?"mid":false;

    (function(){var d=0,c=0;for(var q=0;q<120;q++)if(A.pit[q]!==null&&B.pit[q]!==null){d+=A.pit[q]-B.pit[q];c++;}var sh=c>=5?Math.max(-6,Math.min(6,d/c)):0;B.pit=B.pit.map(function(v){return v===null?null:Math.max(-9,Math.min(9,v+sh));});})();
    var ri=pgCorr(A.pit,B.pit),rr=null;
    if(map&&fb.length>1){var dev=0;for(k=0;k<map.length;k++)dev+=Math.max(0,Math.abs(map[k]/(fb.length-1)-k/Math.max(1,map.length-1))-0.04);rr=Math.max(0,Math.min(1,1-5*dev/map.length));var ec=pgCorr(pgCurve(n,120).en,pgCurve(ma,120).en);rr=(rr+Math.max(0,ec===null?rr:ec))/2;}
    var sp=ma.speech/Math.max(0.2,n.speech),best=0,mark=null;
    for(var i=0;i+16<=120;i+=2){var s=0,c=0;for(k=i;k<i+16;k++)if(A.pit[k]!==null&&B.pit[k]!==null){s+=Math.abs(A.pit[k]-B.pit[k]);c++;}if(c>=8&&s/c>best){best=s/c;mark=[i,i+15];}}
    if(best<2.5)mark=null;
    A.line=contour(A.pit,3);B.line=contour(B.pit,3);
    var mapT=function(fr){var kk=Math.min(nS.length-1,Math.max(0,Math.floor(fr*nS.length)));return map?Math.min(ma.dur,map[Math.min(map.length-1,kk>>1)]*2*ma.hop):fr*ma.dur;};
    LV.res={A:A,B:B,ri:ri,rr:rr,sp:sp,nd:n.speech,md:ma.speech,mark:mark,na:n,ma:ma,mapT:mapT};LV.busy=false;if(LV.id===id)render();
  },function(){LV.busy=false;LV.res={none:true};render();});
}

function pickPractice(n){
  var learned=Object.keys(S.items).filter(function(id){return BYID[id];});
  learned.sort(function(a,b){var x=S.items[a],y=S.items[b];return (x.box||1)-(y.box||1)||(x.due<y.due?-1:1);});
  var out=shuffle(learned.slice(0,Math.max(n*2,n))).slice(0,n);
  if(out.length<n)ORDER.forEach(function(x){if(out.length<n&&out.indexOf(x.id)<0)out.push(x.id);});
  return out;
}

function rpPrompt(){
  var s=RPS[RP.sc],log=RP.turns.map(function(t){return (t.who==="ai"?"PARTNER: ":"LEARNER: ")+t.en;}).join("\n");
  return "You are role-playing a short business English conversation to help a Korean office worker (CEFR A2-B1) practice.\nScenario: "+s.goal+"\nYou play: "+s.partner+".\nRules: stay in your role; use simple, natural business English; 1-2 short sentences per turn; react to what the learner actually said; do not invent prices or company names unless the learner mentions them; if the learner writes in Korean, answer in role in English and put a good English version of their message in fix.better.\nAlso check the learner's LAST message. If it has a grammar mistake or sounds unnatural, give a better version; otherwise fix is null.\nSet done to true when the goal is reached or the learner has spoken 6 times.\nReply with ONLY this JSON: {\"reply\":\"your next line\",\"reply_ko\":\"Korean translation of reply\",\"fix\":null or {\"better\":\"natural English version of the learner's last message\",\"why_ko\":\"짧은 한국어 설명\"},\"done\":false}\n\nConversation so far:\n"+log;
}
function rpSummaryPrompt(){
  var s=RPS[RP.sc],log=RP.turns.map(function(t){return (t.who==="ai"?"PARTNER: ":"LEARNER: ")+t.en;}).join("\n");
  return "A Korean office worker (CEFR A2-B1) just practiced this business English role-play.\nScenario: "+s.goal+"\n\nConversation:\n"+log+"\n\nGive short, encouraging feedback in Korean. Reply with ONLY this JSON: {\"score\":1-5,\"good_ko\":\"잘한 점 한두 문장\",\"fixes\":[{\"mine\":\"learner sentence\",\"better\":\"better English\",\"why_ko\":\"짧은 설명\"}],\"phrases\":[{\"en\":\"useful sentence for this situation\",\"ko\":\"한국어 뜻\",\"tip\":\"key phrase = 뜻\"}]}\nfixes: at most 3, only real problems. phrases: exactly 3 short sentences the learner can reuse at work.";
}
function rpSend(){
  var tx=(RP.input||"").trim();if(!tx||RP.busy||!SAMPLE)return;
  RP.turns.push({who:"me",en:tx});RP.input="";RP.busy=true;RP.err="";render();
  var ctl=RP.ctl=new AbortController(),mine=RP.turns[RP.turns.length-1];
  SAMPLE.json(rpPrompt(),{modelTier:"quick",cache:false,signal:ctl.signal}).then(function(r){
    if(RP.ctl!==ctl)return;RP.busy=false;
    if(r&&r.fix&&r.fix.better)mine.fix=r.fix;
    if(r&&r.reply)RP.turns.push({who:"ai",en:String(r.reply),ko:String(r.reply_ko||"")});
    var mineN=RP.turns.filter(function(t){return t.who==="me";}).length;
    if((r&&r.done)||mineN>=6)rpFinish();else render();
  },function(e){if(RP.ctl!==ctl)return;RP.busy=false;RP.err=aiErr(e);render();});
}
function rpFinish(){
  if(!SAMPLE)return;RP.busy=true;RP.err="";RP.sum={loading:true};render();
  var ctl=RP.ctl=new AbortController();
  SAMPLE.json(rpSummaryPrompt(),{cache:false,signal:ctl.signal}).then(function(r){if(RP.ctl!==ctl)return;RP.busy=false;RP.sum=r||{};render();},function(e){if(RP.ctl!==ctl)return;RP.busy=false;RP.sum=null;RP.err=aiErr(e);render();});
}

  if(QZ.kind==="time"){QZ.left=Math.max(0,60-(Date.now()-QZ.t0)/1000);if(QZ.left<=0&&!QZ.lock){qzEnd();return;}}
  else if(!QZ.lock){QZ.qLeft=Math.max(0,5-(Date.now()-QZ.qt)/1000);if(QZ.qLeft<=0){qzAnswer(-1);return;}}
  var bar=document.getElementById("qzbar"),tx=document.getElementById("qztime");
  var frac=QZ.kind==="time"?QZ.left/60:QZ.qLeft/5;if(bar)bar.style.width=(frac*100).toFixed(1)+"%";if(tx)tx.textContent=QZ.kind==="time"?Math.ceil(QZ.left)+"초":Math.ceil(QZ.qLeft)+"초";
}
function qzAnswer(k){
  var q=QZ.cur;if(!q||QZ.lock)return;QZ.lock=true;q.ans=k;
  var ok=k>=0&&q.opts[k].id===q.w.id,st=qzS().w,r=st[q.w.id]||(st[q.w.id]={c:0,w:0});
  QZ.total++;if(ok){QZ.right++;QZ.combo++;QZ.maxCombo=Math.max(QZ.maxCombo,QZ.combo);QZ.score+=10+Math.min(10,(QZ.combo-1)*2);r.c++;}
  else{QZ.combo=0;r.w++;if(QZ.wrong.indexOf(q.w)<0)QZ.wrong.push(q.w);}
  var sid=QZ.sid;qzBeep(ok,QZ.combo);if(q.dir==="ke")setTimeout(function(){if(QZ.sid===sid&&QZ.cur===q)qzSay(q.w);},200);
  render();
  setTimeout(function(){if(QZ.sid!==sid||QZ.phase!=="play"||view!=="quiz")return;QZ.i++;QZ.qt=Date.now();if(QZ.kind==="time"&&QZ.left<=0){qzEnd();return;}qzNext();},ok?(q.dir==="ke"?900:450):1300);
}
function qzEnd(){
  clearInterval(QZ.timer);QZ.phase="done";QZ.lock=true;
  var key=QZ.kind+"-"+QZ.dir,b=qzS().best;if(!QZ.only&&QZ.score>(b[key]||0)){b[key]=QZ.score;QZ.newBest=true;}
  if(QZ.total>0)markExtra();else save();render();
}

  else if(a==="bkcopy"){
    bk.mode="copy";var code=JSON.stringify(S);bk.msg="";
    var done=function(ok){bk.msg=ok?"복사했습니다. 메모장 등에 붙여 두세요.":"자동 복사가 안 됩니다. 아래 코드를 길게 눌러 전체 선택 후 복사하세요.";render();var o=document.getElementById("bkout");if(o&&!ok){o.focus();o.select();}};
    try{navigator.clipboard.writeText(code).then(function(){done(true);},function(){done(false);});}catch(x){done(false);}
    render();
  }
  else if(a==="bkload"){bk.mode="load";bk.msg="";bk.pending=null;render();}
  else if(a==="bkcheck"){
    var v=(document.getElementById("bkin")||{}).value||"";
    try{var o2=JSON.parse(v.trim());if(!valid(o2))throw 0;bk.pending=o2;bk.mode="confirm";bk.msg="올바른 코드입니다. 배운 표현 "+Object.keys(o2.items).length+"개. 덮어쓰면 지금 이 폰의 기록은 사라집니다.";}
    catch(x){bk.msg="코드가 올바르지 않습니다. 복사한 코드 전체를 붙여 넣었는지 확인하세요.";}
    render();var bi2=document.getElementById("bkin");if(bi2)bi2.value=v;
  }
  else if(a==="bkdo"){if(bk.pending){S=bk.pending;buildItems();bk.pending=null;save();bk.mode="";bk.msg="기록을 불러왔습니다.";render();}}
  else if(a==="home"||a==="quit"){clearAuto();if(OVR){OVR.done=null;}stopDict();OVR=null;dlgStop();stopMine();if(REC.act)aiStopRec();if(RP.ctl)RP.ctl.abort();if(ML.ctl&&ML.busy)ML.ctl.abort();nwStop();SH.phase="idle";view="home";ses=null;render();window.scrollTo(0,0);}
  else if(a==="speak"){speak(b.getAttribute("data-id"));}
  else if(a==="speakeasy"){speakEasy(b.getAttribute("data-id"));}
  else if(a==="next"){advance();}
  else if(a==="pick"){var bi=+b.getAttribute("data-b");if(st.picked.indexOf(bi)<0){st.picked.push(bi);render();}}
  else if(a==="unpick"){st.picked.splice(+b.getAttribute("data-p"),1);render();}
  else if(a==="check"){
    var made=st.picked.map(function(i){return st.bank[i].w;}).join(" ");
    st.res=made===st.toks.join(" ");answered(st.res);render();speak(s.id);
  }
  else if(a==="choose"){st.sel=b.getAttribute("data-id");answered(st.sel===s.id);render();speak(s.id);}
  else if(a==="show"){clearAuto();stopDict();st.shown=true;render();}
  else if(a==="nowsay"){startListen();}
  else if(a==="prac"){
    if(!DICT)return;
    st.prac={on:true,text:"",partial:"",listening:true,busy:false,res:null};
    if(player)player.pause();
    DICT.start({language:"en"}).catch(function(){if(st.prac){st.prac.on=false;st.prac.listening=false;}render();});
    render();
  }
  else if(a==="pracstop"){stopDict();}
  else if(a==="manual"){clearAuto();st.phase="manual";stopDict();render();}
  else if(a==="auto"){var v2=b.getAttribute("data-v");if(v2==="off")S.auto=false;else{S.auto=true;S.think=+v2;}save();render();}
  else if(a==="engine"){S.engine=b.getAttribute("data-v");pickDict();if(S.engine==="ai")aiLoad();save();render();}
  else if(a==="aiload"){aiLoad();render();}
  else if(a==="self"){var v=b.getAttribute("data-ok");answered(v==="1"?true:v==="mid"?"mid":false);advance();}
  else if(a==="hint"){
    if(st.hint<3){
      st.hint++;
      if(st.phase==="think"||st.phase==="listen"){
        /* 힌트를 읽는 동안 시간이 흐르지 않게: 듣기를 멈추고 생각 시간부터 다시 */
        clearAuto();st.phase="manual";stopDict();render();
        var tries=0,wait=setInterval(function(){
          tries++;
          if(curRecall()!==st||st.phase!=="manual"){clearInterval(wait);return;}
          if(!DICT||!DICT.active()||tries>25){clearInterval(wait);st.text="";st.partial="";beginThink();}
        },100);
      }else render();
    }
  }
  else if(a==="mic"||a==="redo"){
    if(!DICT)return;
    if(a==="redo"){st.text="";st.partial="";syncBox();}
    if(st.phase==="think"){startListen();return;}
    if(DICT.active()){DICT.stop().catch(function(){});return;}
    DICT.start({language:"en"}).catch(function(err){
      var c=err&&err.code;
      if(c==="not_granted"||c==="unavailable"){dictOff=true;}
      var s2=curRecall();if(s2){s2.listening=false;}
      render();
    });
  }
  else if(a==="checkSay"){doCheck();}
});
app.addEventListener("input",function(e){
  if(e.target.id!=="ans")return;
  var st=curRecall();if(!st)return;
  if(st.phase==="think"||st.phase==="listen"){clearAuto();stopDict();st.phase="manual";var ab=document.getElementById("autobox");if(ab)ab.remove();}
  st.text=e.target.value;st.partial="";
  var b=app.querySelector('[data-act="checkSay"]');if(b)b.disabled=!st.text.trim();
});
render();
})();
</script>
